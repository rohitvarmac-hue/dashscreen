<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);

function resolveAndroidBridge() {
  const candidates = [
    window.AndroidBridge,
    window.NativeBridge,
    window.WebViewBridge,
    window.Bridge,
    window.android,
    window.nativeApp
  ];
  for (const bridge of candidates) {
    if (bridge && typeof bridge === 'object') {
      return bridge;
    }
  }
  return null;
}

const getAndroidBridge = () => resolveAndroidBridge();
const hasAndroidBridge = () => !!resolveAndroidBridge();

const VEHICLE_PROFILES = {
  motorcycle: {
    icon: '🏍️',
    label: '🏍️ MOTORCYCLE MODE',
    btnTitle: 'Dashboard Mode: Bike (Tap to switch to Car)',
    avgSpeedKmh: 42,
    routeColor: '#00d084',
    googleDirFlag: 'l',
    minFrontPsi: 26,
    minRearPsi: 30
  },
  car: {
    icon: '🚗',
    label: '🚗 CAR MODE',
    btnTitle: 'Dashboard Mode: Car (Tap to switch to Bike)',
    avgSpeedKmh: 50,
    routeColor: '#08a9ff',
    googleDirFlag: 'd',
    minFrontPsi: 30,
    minRearPsi: 32
  }
};

let selectedVehicle = localStorage.getItem('mymotonav_vehicle') || 'motorcycle';
let selectedNavPkg = localStorage.getItem('mymotonav_nav_pkg') || 'gmaps';
let selectedNavName = localStorage.getItem('mymotonav_nav_name') || 'Google Maps';
let selectedAudioPkg = localStorage.getItem('mymotonav_audio_pkg') || 'local';
let selectedAudioName = localStorage.getItem('mymotonav_audio_name') || 'Local File';
let isExternalPlaying = false;
let currentLat = 17.3850, currentLon = 78.4867;
let activeOriginText = '';
let pendingDestinationText = '';
let is3dNavigationActive = false;
let tpmsState = { f: null, r: null, fl: null, fr: null, rl: null, rr: null };
let activeRoute = null, routeLine = null, destMarker = null;

// Clock
function tick(){ $('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); }
tick();setInterval(tick,1000);

// Map Setup (Google Maps Embedded Interface Default + OSM Fallback)
const map=L.map('map',{zoomControl:false}).setView([currentLat,currentLon],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
let marker=null,accuracy=null,last=null,watchId=null;

function syncGoogleMapsModeButtons(){
  const isCar = selectedVehicle === 'car';
  $('gmaps2wBtn').classList.toggle('active', !isCar);
  $('gmaps4wBtn').classList.toggle('active', isCar);
}

function buildGoogleMapsUrl(queryText, lat, lon, vehicleMode, originText = ''){
  const travelMode = vehicleMode === 'car' ? 'driving' : 'two-wheeler';
  const dest = (queryText || '').trim();
  const origin = (originText || '').trim();

  if(dest && origin){
    return `https://www.google.com/maps?saddr=${encodeURIComponent(origin)}&daddr=${encodeURIComponent(dest)}&travelmode=${encodeURIComponent(travelMode)}&output=embed`;
  }
  if(dest){
    return `https://www.google.com/maps?saddr=${encodeURIComponent(`${lat},${lon}`)}&daddr=${encodeURIComponent(dest)}&travelmode=${encodeURIComponent(travelMode)}&output=embed`;
  }
  return `https://www.google.com/maps?q=${lat},${lon}&z=15&travelmode=${encodeURIComponent(travelMode)}&output=embed`;
}

function loadGoogleMapsInterface(queryText = '', originText = activeOriginText){
  const frame = $('embedMapFrame');
  $('map').style.display = 'none';
  $('mapActions').style.display = 'none';
  frame.style.display = 'block';
  syncGoogleMapsModeButtons();

  const url = buildGoogleMapsUrl(queryText, currentLat, currentLon, selectedVehicle, originText);
  if(frame.src !== url){
    frame.src = url;
  }

  const modeLabel = selectedVehicle === 'car' ? '4W Car' : '2W Bike';
  if(queryText){
    const fromLabel = originText ? originText : 'Current Location';
    $('navDist').innerHTML = `🧭 &nbsp;3D ${modeLabel}`;
    $('navInstr').textContent = `${fromLabel} → ${queryText}`;
    $('clearNav').style.display = 'inline-block';
  } else {
    $('navDist').innerHTML = `📍 &nbsp;GOOGLE MAPS (${modeLabel})`;
    $('navInstr').textContent = 'Use Google Maps 2W/4W controls & search on screen';
    $('clearNav').style.display = 'none';
  }
}

function set3dNavigationPerspective(enabled){
  is3dNavigationActive = !!enabled;
  const wrap = document.querySelector('.map-wrap');
  if(wrap){
    wrap.classList.toggle('nav-3d-active', is3dNavigationActive);
  }
}

async function fetchPlaceSuggestions(query){
  const trimmed = (query || '').trim();
  if(trimmed.length < 2) return [];
  try {
    const viewbox = `${currentLon-1.5},${currentLat+1.5},${currentLon+1.5},${currentLat-1.5}`;
    const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&viewbox=${viewbox}&q=${encodeURIComponent(trimmed)}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    if(!Array.isArray(data)) return [];
    return data.map(item => {
      const parts = (item.display_name || '').split(',').map(s => s.trim()).filter(Boolean);
      return {
        main: parts[0] || trimmed,
        sub: parts.slice(1, 3).join(', ') || 'Map Place',
        full: item.display_name || trimmed,
        lat: parseFloat(item.lat),
        lon: parseFloat(item.lon)
      };
    });
  } catch (err) {
    return [];
  }
}

function renderSuggestionList(listEl, items, onSelectItem){
  listEl.innerHTML = '';
  if(!items || items.length === 0){
    listEl.classList.remove('open');
    return;
  }
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'suggest-item';
    btn.innerHTML = `<span class="suggest-main">${item.main}</span><span class="suggest-sub">${item.sub}</span>`;
    btn.onclick = () => {
      onSelectItem(item);
      listEl.classList.remove('open');
    };
    listEl.appendChild(btn);
  });
  listEl.classList.add('open');
}

let destSuggestTimer = null;
$('destInput').addEventListener('input', e => {
  const val = e.target.value;
  clearTimeout(destSuggestTimer);
  if(val.trim().length < 2){
    $('destSuggestList').classList.remove('open');
    return;
  }
  destSuggestTimer = setTimeout(async () => {
    const items = await fetchPlaceSuggestions(val);
    renderSuggestionList($('destSuggestList'), items, chosen => {
      $('destInput').value = chosen.main;
    });
  }, 240);
});

let originSuggestTimer = null;
$('customOriginInput').addEventListener('input', e => {
  const val = e.target.value;
  clearTimeout(originSuggestTimer);
  if(val.trim().length < 2){
    $('originSuggestList').classList.remove('open');
    return;
  }
  originSuggestTimer = setTimeout(async () => {
    const items = await fetchPlaceSuggestions(val);
    renderSuggestionList($('originSuggestList'), items, chosen => {
      $('customOriginInput').value = chosen.main;
    });
  }, 240);
});

document.addEventListener('click', e => {
  if(!$('destInput').contains(e.target) && !$('destSuggestList').contains(e.target)){
    $('destSuggestList').classList.remove('open');
  }
  if(!$('customOriginInput').contains(e.target) && !$('originSuggestList').contains(e.target)){
    $('originSuggestList').classList.remove('open');
  }
});

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDist(meters){
  if(!Number.isFinite(meters) || meters <= 0) return '0 m';
  if(meters >= 1000) return `${(meters / 1000).toFixed(1)} km`;
  return `${Math.round(meters)} m`;
}

function formatDuration(seconds){
  if(!Number.isFinite(seconds) || seconds <= 0) return '--';
  const mins = Math.round(seconds / 60);
  if(mins < 60) return `${mins} min`;
  const hrs = Math.floor(mins / 60);
  const remMins = mins % 60;
  return remMins ? `${hrs}h ${remMins}m` : `${hrs}h`;
}

function getManeuverArrow(type, modifier){
  const m = (modifier || '').toLowerCase();
  if(type === 'arrive') return '🏁';
  if(m.includes('sharp left')) return '↰';
  if(m.includes('sharp right')) return '↱';
  if(m.includes('slight left') || m.includes('left')) return '↖';
  if(m.includes('slight right') || m.includes('right')) return '↗';
  if(m.includes('uturn')) return '↩';
  return '↑';
}

let noticeTimer = null;
function showNotice(message){
  const box = $('notice');
  if(!box) return;
  box.textContent = message;
  box.style.display = 'block';
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    box.style.display = 'none';
  }, 3600);
}

async function startOsmRoute(query, customOrigin = ''){
  $('navDist').innerHTML = '⏳ &nbsp;NAVIGATING';
  $('navInstr').textContent = 'Starting route...';
  try {
    const viewbox = `${currentLon-1},${currentLat+1},${currentLon+1},${currentLat-1}`;
    let startLat = currentLat;
    let startLon = currentLon;
    let startLabel = 'Current Location';

    if(customOrigin && customOrigin.trim()){
      const originRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=${viewbox}&q=${encodeURIComponent(customOrigin.trim())}`);
      const originData = await originRes.json();
      if(originData && originData.length > 0){
        startLat = parseFloat(originData[0].lat);
        startLon = parseFloat(originData[0].lon);
        startLabel = originData[0].display_name.split(',')[0];
      }
    }

    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=${viewbox}&q=${encodeURIComponent(query)}`);
    const geoData = await geoRes.json();
    if(!geoData || geoData.length === 0){
      showNotice('Destination not found.');
      clearOsmRoute();
      return;
    }
    const destLat = parseFloat(geoData[0].lat);
    const destLon = parseFloat(geoData[0].lon);
    const destName = geoData[0].display_name.split(',')[0];

    const profileKey = selectedVehicle === 'car' ? 'driving' : 'cycling';
    const routeUrl = `https://router.project-osrm.org/route/v1/${profileKey}/${startLon},${startLat};${destLon},${destLat}?overview=full&geometries=geojson&steps=true`;
    const routeRes = await fetch(routeUrl);
    const routeData = await routeRes.json();
    if(routeData.code !== 'Ok' || !routeData.routes.length){
      showNotice('Could not calculate route.');
      clearOsmRoute();
      return;
    }

    const route = routeData.routes[0];
    activeRoute = { steps: route.legs[0].steps, destLat, destLon, destName, startLabel };

    if(routeLine) map.removeLayer(routeLine);
    if(destMarker) map.removeLayer(destMarker);

    const profile = VEHICLE_PROFILES[selectedVehicle];
    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
    routeLine = L.polyline(coords, {color: profile.routeColor, weight: 6, opacity: 0.9}).addTo(map);
    destMarker = L.marker([destLat, destLon]).addTo(map).bindPopup(destName);
    map.fitBounds(routeLine.getBounds(), {padding: [60, 60]});

    $('clearNav').style.display = 'inline-block';
    updateActiveNavigation(startLat, startLon);
  } catch (err) {
    showNotice('Routing error: Check internet connection.');
    clearOsmRoute();
  }
}

function beginNavigationSession(destination, originText){
  const modeLabel = selectedVehicle === 'car' ? '4W' : '2W';
  const fromLabel = originText && originText.trim() ? originText.trim() : 'Current Location';

  $('destSuggestList').classList.remove('open');
  $('originSuggestList').classList.remove('open');
  $('clearNav').style.display = 'inline-block';
  $('navDist').innerHTML = `🧭 &nbsp;3D ${modeLabel} ACTIVE`;
  $('navInstr').textContent = `${fromLabel} → ${destination}`;
  $('eta').textContent = '3D LIVE';
  $('tripDistance').textContent = `3D Route to ${destination}`;
  set3dNavigationPerspective(true);

  if(selectedNavPkg === 'gmaps'){
    loadGoogleMapsInterface(destination, originText);
  }
  startOsmRoute(destination, originText);
}

function updateActiveNavigation(lat, lon){
  if(!activeRoute) return;
  const profile = VEHICLE_PROFILES[selectedVehicle];
  let closestIdx = 0, minDist = Infinity;
  activeRoute.steps.forEach((step, idx) => {
    const [mLon, mLat] = step.maneuver.location;
    const d = haversine(lat, lon, mLat, mLon);
    if(d < minDist){ minDist = d; closestIdx = idx; }
  });

  const targetIdx = (minDist < 25 && closestIdx + 1 < activeRoute.steps.length) ? closestIdx + 1 : closestIdx;
  const step = activeRoute.steps[targetIdx];
  const [tLon, tLat] = step.maneuver.location;
  const distToTurn = haversine(lat, lon, tLat, tLon);

  const arrow = getManeuverArrow(step.maneuver.type, step.maneuver.modifier);
  const roadName = step.name ? ` onto ${step.name}` : '';
  const action = step.maneuver.type === 'arrive'
    ? `Arrive at ${activeRoute.destName}`
    : `${(step.maneuver.modifier || step.maneuver.type).replace('-', ' ')}${roadName}`;

  $('navDist').innerHTML = `${arrow} &nbsp;${formatDist(distToTurn)}`;
  $('navInstr').textContent = action.charAt(0).toUpperCase() + action.slice(1);

  const remDist = haversine(lat, lon, activeRoute.destLat, activeRoute.destLon) * 1.25;
  const estSecs = (remDist / 1000) / profile.avgSpeedKmh * 3600;
  $('eta').textContent = formatDuration(estSecs);
  $('tripDistance').textContent = `${formatDist(remDist)} to ${activeRoute.destName}`;
}

function clearOsmRoute(){
  activeRoute = null;
  activeOriginText = '';
  pendingDestinationText = '';
  set3dNavigationPerspective(false);
  if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
  if(destMarker){ map.removeLayer(destMarker); destMarker = null; }
  if(selectedNavPkg === 'gmaps'){
    $('destInput').value = '';
    loadGoogleMapsInterface('', '');
  } else {
    $('clearNav').style.display = 'none';
    $('navDist').innerHTML = '🧭 &nbsp;OSM MAP';
    $('navInstr').textContent = 'Enter destination or ride';
    $('eta').textContent = 'GPS FIX';
  }
}
$('clearNav').onclick = clearOsmRoute;

// --- IN-DASHBOARD MAP PROVIDER SWITCHER ---
function getInstalledNavApps(){
  return [
    { name: 'Google Maps', packageName: 'gmaps', icon: '📍' },
    { name: 'OSM In-App', packageName: 'osm', icon: '🗺️' }
  ];
}

function openNavAppPicker(){
  const list = $('navAppList');
  list.innerHTML = '';
  const apps = getInstalledNavApps();

  apps.forEach(app => {
    const card = document.createElement('button');
    card.className = 'app-card' + (app.packageName === selectedNavPkg ? ' active' : '');
    card.innerHTML = `<span class="icon">${app.icon || '📍'}</span><span>${app.name}</span>`;
    card.onclick = () => selectAndLaunchNavApp(app);
    list.appendChild(card);
  });

  $('navModal').style.display = 'flex';
}

function selectAndLaunchNavApp(app){
  $('navModal').style.display = 'none';
  selectedNavPkg = app.packageName;
  selectedNavName = app.name;
  localStorage.setItem('mymotonav_nav_pkg', app.packageName);
  localStorage.setItem('mymotonav_nav_name', app.name);
  $('navSourceLabel').textContent = app.name;

  if(app.packageName === 'gmaps'){
    loadGoogleMapsInterface($('destInput').value.trim());
    return;
  }

  $('embedMapFrame').style.display = 'none';
  $('map').style.display = 'block';
  $('mapActions').style.display = 'flex';
  map.invalidateSize();
  $('navDist').innerHTML = '🧭 &nbsp;OSM MAP';
  $('navInstr').textContent = 'Enter destination or ride';
}

$('navIconBtn').onclick = openNavAppPicker;
$('closeNavModal').onclick = () => $('navModal').style.display = 'none';
$('navModal').onclick = e => { if(e.target === $('navModal')) $('navModal').style.display = 'none'; };
$('navSourceLabel').textContent = selectedNavName;

function openOriginPickerModal(destination){
  pendingDestinationText = destination;
  $('customOriginWrap').classList.remove('open');
  $('useCurrentLocationBtn').classList.remove('selected');
  $('chooseCustomOriginBtn').classList.remove('selected');
  $('customOriginInput').value = activeOriginText || '';
  $('originModal').style.display = 'flex';
}

function closeOriginPickerModal(){
  $('originModal').style.display = 'none';
}

$('closeOriginModal').onclick = closeOriginPickerModal;
$('originModal').onclick = e => { if(e.target === $('originModal')) closeOriginPickerModal(); };

$('useCurrentLocationBtn').onclick = () => {
  $('useCurrentLocationBtn').classList.add('selected');
  $('chooseCustomOriginBtn').classList.remove('selected');
  $('customOriginWrap').classList.remove('open');
  activeOriginText = '';
  closeOriginPickerModal();
  beginNavigationSession(pendingDestinationText, '');
};

$('chooseCustomOriginBtn').onclick = () => {
  $('chooseCustomOriginBtn').classList.add('selected');
  $('useCurrentLocationBtn').classList.remove('selected');
  $('customOriginWrap').classList.add('open');
  $('customOriginInput').focus();
};

$('confirmCustomOriginBtn').onclick = () => {
  const customOrigin = $('customOriginInput').value.trim();
  if(!customOrigin){
    showNotice('Please enter an origin location.');
    return;
  }
  activeOriginText = customOrigin;
  closeOriginPickerModal();
  beginNavigationSession(pendingDestinationText, activeOriginText);
};

$('launchNav').onclick = () => {
  const dest = $('destInput').value.trim();
  if(!dest){
    showNotice('Enter a destination first.');
    return;
  }
  openOriginPickerModal(dest);
};
// --- DYNAMIC INSTALLED MUSIC APP PICKER ---
function getInstalledMusicApps(){
  const bridge = getAndroidBridge();
  if(bridge && typeof bridge.getInstalledMusicApps === 'function'){
    try {
      const parsed = JSON.parse(bridge.getInstalledMusicApps());
      if(Array.isArray(parsed) && parsed.length > 0) return parsed;
    } catch(e) {}
  }
  return [
    { name: 'YouTube Music', packageName: 'com.google.android.apps.youtube.music', icon: '▶️' },
    { name: 'Amazon Music', packageName: 'com.amazon.mp3', icon: '🎧' },
    { name: 'Spotify', packageName: 'com.spotify.music', icon: '🟢' },
    { name: 'Local Audio File', packageName: 'local', icon: '📁' }
  ];
}

function openMusicAppPicker(){
  const list = $('musicAppList');
  list.innerHTML = '';
  const apps = getInstalledMusicApps();

  apps.forEach(app => {
    const card = document.createElement('button');
    card.className = 'app-card' + (app.packageName === selectedAudioPkg ? ' active' : '');
    card.innerHTML = `<span class="icon">${app.icon || '🎵'}</span><span>${app.name}</span>`;
    card.onclick = () => selectAndLaunchMusicApp(app);
    list.appendChild(card);
  });

  $('musicModal').style.display = 'flex';
}

function selectAndLaunchMusicApp(app){
  $('musicModal').style.display = 'none';
  selectedAudioPkg = app.packageName;
  selectedAudioName = app.name;
  localStorage.setItem('mymotonav_audio_pkg', app.packageName);
  localStorage.setItem('mymotonav_audio_name', app.name);
  $('activeAppBadge').textContent = `🎵 ${app.name} ▾`;

  if(app.packageName === 'local'){
    $('file').click();
    return;
  }

  $('audio').pause();
  $('trackName').textContent = `${app.name}`;
  $('artistName').textContent = 'Start playback in app, then return here';

  const bridge = getAndroidBridge();
  if(bridge && typeof bridge.launchPackage === 'function'){
    bridge.launchPackage(app.packageName);
  } else {
    showNotice(`Selected ${app.name}. Connect a native bridge in Native App AI to launch & control external music apps.`);
  }
}

$('musicIconBtn').onclick = openMusicAppPicker;
$('activeAppBadge').onclick = openMusicAppPicker;
$('closeMusicModal').onclick = () => $('musicModal').style.display = 'none';
$('musicModal').onclick = e => { if(e.target === $('musicModal')) $('musicModal').style.display = 'none'; };

if(selectedAudioName && selectedAudioName !== 'Local File'){
  $('activeAppBadge').textContent = `🎵 ${selectedAudioName} ▾`;
}

// Local audio fallback
const audio=$('audio');
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f)return;
  selectedAudioPkg = 'local';
  selectedAudioName = 'Local File';
  $('activeAppBadge').textContent = '🎵 Local File ▾';
  audio.src=URL.createObjectURL(f);
  $('trackName').textContent=f.name;
  $('artistName').textContent='Local Device Storage';
  audio.play().then(()=>$('play').textContent='Ⅱ').catch(()=>{});
});

// Unified Media Controls
$('play').onclick=()=>{
  const bridge = getAndroidBridge();
  if(selectedAudioPkg !== 'local'){
    if(bridge && typeof bridge.sendMediaCommand === 'function'){
      bridge.sendMediaCommand('play_pause');
      isExternalPlaying = !isExternalPlaying;
      $('play').textContent = isExternalPlaying ? 'Ⅱ' : '▶';
    } else {
      showNotice('Native bridge required to control external music apps.');
    }
    return;
  }
  if(!audio.src){ openMusicAppPicker(); return; }
  if(audio.paused){audio.play();$('play').textContent='Ⅱ';}else{audio.pause();$('play').textContent='▶';}
};

$('prev').onclick=()=>{
  const bridge = getAndroidBridge();
  if(selectedAudioPkg !== 'local' && bridge && typeof bridge.sendMediaCommand === 'function') bridge.sendMediaCommand('prev');
  else audio.currentTime=0;
};

$('next').onclick=()=>{
  const bridge = getAndroidBridge();
  if(selectedAudioPkg !== 'local' && bridge && typeof bridge.sendMediaCommand === 'function') bridge.sendMediaCommand('next');
  else audio.currentTime=audio.duration||0;
};

$('volume').oninput=e=>{
  const val = Number(e.target.value);
  audio.volume = val;
  const bridge = getAndroidBridge();
  if(bridge && typeof bridge.setSystemVolume === 'function'){
    bridge.setSystemVolume(Math.round(val * 100));
  }
};

audio.onplay=()=> $('play').textContent='Ⅱ';
audio.onpause=()=> $('play').textContent='▶';

// --- NATIVE ANDROID CALLBACK HOOKS ---
window.updateTrackInfo = function(title, artist, playing, appName){
  $('trackName').textContent = title || 'Playing';
  $('artistName').textContent = artist || (appName ? `via ${appName}` : '');
  if(appName) $('activeAppBadge').textContent = `🎵 ${appName} ▾`;
  isExternalPlaying = !!playing;
  $('play').textContent = isExternalPlaying ? 'Ⅱ' : '▶';
};

window.updateGpsSatellites = function(used, total){
  $('satCount').textContent = `Satellites: ${used}/${total} fixed`;
};

// --- GPS & SPEEDOMETER ---
function updateSpeed(kmh){$('speed').textContent=Math.max(0,Math.round(kmh||0));}
function onPosition(pos){
 const c=pos.coords,lat=c.latitude,lon=c.longitude;
 const movedEnough = haversine(currentLat, currentLon, lat, lon) > 150;
 currentLat = lat; currentLon = lon;
 $('gpsState').textContent='GPS ACTIVE';
 let kmh=Number.isFinite(c.speed)&&c.speed>=0?c.speed*3.6:0;
 if((!c.speed||c.speed===0)&&last){
   const dt=(pos.timestamp-last.t)/1000;
   if(dt>0) kmh = (haversine(last.lat, last.lon, lat, lon) / dt) * 3.6;
 }
 last={lat,lon,t:pos.timestamp};updateSpeed(kmh);
 if(!marker){marker=L.marker([lat,lon]).addTo(map).bindPopup('Your location');map.setView([lat,lon],16);}else marker.setLatLng([lat,lon]);
 if(accuracy){map.removeLayer(accuracy)}accuracy=L.circle([lat,lon],{radius:c.accuracy,color:'#08a9ff',weight:1,fillOpacity:.06}).addTo(map);

 if(selectedNavPkg === 'gmaps' && !$('destInput').value.trim() && movedEnough){
   loadGoogleMapsInterface('', activeOriginText);
 }

 if(activeRoute){
   updateActiveNavigation(lat, lon);
 } else {
   $('tripDistance').textContent='Accuracy ±'+Math.round(c.accuracy)+' m';
   $('eta').textContent='GPS FIX';
 }
}
function startGPS(){
 if(!navigator.geolocation){showNotice('GPS not supported.');return;}
 if(watchId!==null)return;
 watchId=navigator.geolocation.watchPosition(onPosition,e=>{showNotice('GPS error: '+e.message);$('gpsState').textContent='GPS ERROR';},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}
$('locate').onclick=()=>{
  startGPS();
  if(selectedNavPkg === 'gmaps'){
    loadGoogleMapsInterface($('destInput').value.trim(), activeOriginText);
    return;
  }
  if(marker)map.setView(marker.getLatLng(),16);
};
$('north').onclick=()=>map.setBearing?map.setBearing(0):map.setView(map.getCenter(),map.getZoom());
$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();startGPS();

// Portrait Mode Auto-Sync & Preview Toggle
let portraitPreviewForced = false;
function applyOrientationLayout(){
  const isSystemPortrait = window.matchMedia && window.matchMedia('(orientation: portrait)').matches;
  const root = $('dashboardRoot');
  root.classList.toggle('portrait-mode', isSystemPortrait);
  root.classList.toggle('portrait-preview', portraitPreviewForced);
  $('portraitToggleBtn').style.borderColor = portraitPreviewForced ? '#08a9ff' : '#71849a';
  $('portraitToggleBtn').style.background = portraitPreviewForced ? '#0b2c48' : '#071321dd';
  setTimeout(() => map.invalidateSize(), 180);
}
$('portraitToggleBtn').onclick = () => {
  portraitPreviewForced = !portraitPreviewForced;
  applyOrientationLayout();
};
window.addEventListener('resize', applyOrientationLayout);
applyOrientationLayout();

// Battery
if(navigator.getBattery){navigator.getBattery().then(b=>{const paint=()=>$('battery').textContent=Math.round(b.level*100)+'%';paint();b.addEventListener('levelchange',paint);}).catch(()=>{});}else $('battery').textContent='N/A';

function paintTpms(elId, val, minPsi){
  const el = $(elId);
  if(!el) return;
  if(val === null || val === undefined || Number.isNaN(Number(val))){
    el.textContent = '--';
    el.classList.remove('warn');
    return;
  }
  const num = Number(val);
  el.textContent = num.toFixed(1);
  el.classList.toggle('warn', num > 0 && num < minPsi);
}

function refreshTpmsDisplay(){
  const isCar = selectedVehicle === 'car';
  const profile = VEHICLE_PROFILES[selectedVehicle] || VEHICLE_PROFILES.motorcycle;
  $('tpmsBikeView').style.display = isCar ? 'none' : 'block';
  $('tpmsCarView').style.display = isCar ? 'flex' : 'none';
  paintTpms('frontPsi', tpmsState.f, profile.minFrontPsi);
  paintTpms('rearPsi', tpmsState.r, profile.minRearPsi);
  paintTpms('flPsi', tpmsState.fl, profile.minFrontPsi);
  paintTpms('frPsi', tpmsState.fr, profile.minFrontPsi);
  paintTpms('rlPsi', tpmsState.rl, profile.minRearPsi);
  paintTpms('rrPsi', tpmsState.rr, profile.minRearPsi);
}

function setVehicleMode(mode){
  selectedVehicle = VEHICLE_PROFILES[mode] ? mode : 'motorcycle';
  localStorage.setItem('mymotonav_vehicle', selectedVehicle);
  const profile = VEHICLE_PROFILES[selectedVehicle];
  const isCar = selectedVehicle === 'car';

  const root = $('dashboardRoot');
  const tpmsBox = $('tpmsContainer');
  const modeIcon = $('vehicleModeIcon');
  if(root) root.classList.toggle('car-active', isCar);
  if(tpmsBox){
    tpmsBox.classList.toggle('car-size', isCar);
    tpmsBox.classList.toggle('bike-size', !isCar);
  }
  if(modeIcon){
    modeIcon.textContent = profile.icon;
    modeIcon.classList.toggle('car-mode', isCar);
  }
  if($('modeBadge')) $('modeBadge').textContent = profile.label;
  syncGoogleMapsModeButtons();
  refreshTpmsDisplay();

  if(selectedNavPkg === 'gmaps'){
    const currentDest = $('destInput') ? $('destInput').value.trim() : '';
    loadGoogleMapsInterface(currentDest, activeOriginText);
  }
}

window.setTpms = function(front, rear){
  tpmsState.f = front;
  tpmsState.r = rear;
  refreshTpmsDisplay();
};

window.setTpms4 = function(fl, fr, rl, rr){
  tpmsState.fl = fl;
  tpmsState.fr = fr;
  tpmsState.rl = rl;
  tpmsState.rr = rr;
  refreshTpmsDisplay();
};

setVehicleMode(selectedVehicle);
if(selectedNavPkg === 'gmaps'){
  loadGoogleMapsInterface('', activeOriginText);
}
</script>
</body></html>
